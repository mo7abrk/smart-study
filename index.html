    class FeedbackEngine {
      constructor() { this.ctx = null; this.muted = false; this.hapticsEnabled = true; }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      vibrate(p) { if (this.hapticsEnabled && typeof window !== 'undefined' && 'vibrate' in navigator) try { navigator.vibrate(p); } catch (e) {} }
      toggleMute() { this.muted = !this.muted; return this.muted; }
      toggleHaptics() { this.hapticsEnabled = !this.hapticsEnabled; return this.hapticsEnabled; }
      playClick(freq = 600, duration = 0.04) {
        this.vibrate(10); if (this.muted) return; this.init();
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + duration);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
      }
      playFlip() {
        this.vibrate(15); if (this.muted) return; this.init();
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(480, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.08);
      }
      playRatingSound(quality) {
        this.init(); const now = this.ctx.currentTime;
        switch (quality) {
          case 0:
            this.vibrate([40, 30, 40]);
            if (!this.muted) {
              const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
              osc.type = 'sawtooth'; osc.frequency.setValueAtTime(280, now);
              osc.frequency.linearRampToValueAtTime(130, now + 0.18);
              gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
              osc.connect(gain); gain.connect(this.ctx.destination);
              osc.start(now); osc.stop(now + 0.18);
            }
            break;
          case 3: this.vibrate(25); if (!this.muted) this.playTone(392, 0.12); break;
          case 4: this.vibrate([15, 20, 15]); if (!this.muted) this.playArpeggio([523.25, 659.25], 0.12); break;
          case 5: this.vibrate([10, 15, 10, 15, 10]); if (!this.muted) this.playArpeggio([523.25, 659.25, 783.99, 1046.50], 0.18); break;
        }
      }
      playTone(freq, duration) {
        if (this.muted) return;
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
      }
      playArpeggio(freqs, duration) { freqs.forEach((f, i) => setTimeout(() => this.playTone(f, duration), i * 50)); }
    }

    const feedback = new FeedbackEngine();

    const triggerConfetti = () => {
      const colors = ['#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899'];
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'confetti-particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = '-10px';
        p.style.width = Math.random() * 8 + 6 + 'px';
        p.style.height = Math.random() * 8 + 6 + 'px';
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 2500);
      }
    };

    // Defensive validators: never trust data coming from an imported file.
    const isSafeImageUrl = (url) => typeof url === 'string' && /^(https?:\/\/|data:image\/)/i.test(url.trim());

    // Shared by both the paste-in Import feature and the AI-assisted Generator:
    // tolerantly extracts an array of {front, back} pairs from arbitrary pasted text.
    // Handles: raw JSON, JSON wrapped in ```/```json code fences, JSON with stray
    // prose before/after it (common when an AI ignores "output only JSON"), and a
    // plain CSV fallback ("front,back" one pair per line, quoted fields supported).
    const parseCardsFromText = (rawText) => {
      const trimmed = (rawText || '').trim();
      if (!trimmed) return [];

      const candidates = [trimmed];
      const fenceMatch = trimmed.match(/```(?:json)?\s*([\s\S]*?)```/i);
      if (fenceMatch) candidates.unshift(fenceMatch[1].trim());
      const arrayMatch = trimmed.match(/\[[\s\S]*\]/);
      if (arrayMatch) candidates.push(arrayMatch[0]);

      for (const candidate of candidates) {
        try {
          const parsed = JSON.parse(candidate);
          if (Array.isArray(parsed)) {
            const cards = parsed
              .map(item => ({
                front: String(item?.front ?? item?.question ?? item?.q ?? '').trim(),
                back: String(item?.back ?? item?.answer ?? item?.a ?? '').trim(),
                image: isSafeImageUrl(item?.image) ? item.image.trim() : ''
              }))
              .filter(c => c.front && c.back);
            if (cards.length > 0) return cards;
          }
        } catch (e) { /* try next candidate */ }
      }

      // Fallback: CSV, one card per line as "front,back" (quoted fields supported).
      const csvLineRegex = /^(?:"([^"]*(?:""[^"]*)*)"|([^,]*)),(?:"([^"]*(?:""[^"]*)*)"|(.*))$/;
      return trimmed.split('\n')
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {
          const m = line.match(csvLineRegex);
          if (!m) return null;
          const front = (m[1] ?? m[2] ?? '').replace(/""/g, '"').trim();
          const back = (m[3] ?? m[4] ?? '').replace(/""/g, '"').trim();
          return front && back ? { front, back, image: '' } : null;
        })
        .filter(Boolean);
    };

    // Clipboard write with a fallback for contexts where the modern Clipboard API
    // is unavailable (e.g. a file:// page opened directly on a phone, which is not
    // a "secure context" and so navigator.clipboard may be undefined or blocked).
    const copyTextToClipboard = async (text) => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
        throw new Error('Clipboard API unavailable');
      } catch (e) {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(textarea);
          return ok;
        } catch (e2) {
          return false;
        }
      }
    };

    const sanitizeCard = (c) => {
      if (!c || typeof c !== 'object') return null;
      const front = typeof c.front === 'string' ? c.front : '';
      const back = typeof c.back === 'string' ? c.back : '';
      if (!front.trim() || !back.trim()) return null;
      return {
        id: typeof c.id === 'string' && c.id ? c.id : 'card-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        front,
        back,
        image: isSafeImageUrl(c.image) ? c.image.trim() : '',
        repetitions: Number.isFinite(c.repetitions) ? c.repetitions : 0,
        interval: Number.isFinite(c.interval) && c.interval > 0 ? c.interval : 1,
        easiness: Number.isFinite(c.easiness) ? Math.max(1.3, c.easiness) : 2.5,
        dueDate: typeof c.dueDate === 'string' && !isNaN(Date.parse(c.dueDate)) ? c.dueDate : new Date().toISOString()
      };
    };

    const sanitizeDeck = (d) => {
      if (!d || typeof d !== 'object') return null;
      const title = typeof d.title === 'string' && d.title.trim() ? d.title.trim() : 'Untitled Deck';
      const cards = Array.isArray(d.cards) ? d.cards.map(sanitizeCard).filter(Boolean) : [];
      return {
        id: typeof d.id === 'string' && d.id ? d.id : 'deck-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        title,
        description: typeof d.description === 'string' ? d.description : '',
        cards
      };
    };

    const sanitizeDecksArray = (arr) => Array.isArray(arr) ? arr.map(sanitizeDeck).filter(Boolean) : null;

    const isCardDue = (card) => {
      if (!card.dueDate) return true;
      const due = new Date(card.dueDate);
      if (isNaN(due.getTime())) return true;
      return due.getTime() <= Date.now();
    };

    const calculateSM2 = (quality, repetitions, interval, easiness) => {
      let nextRepetitions = repetitions, nextInterval = interval, nextEasiness = easiness;
      if (quality >= 3) {
        if (repetitions === 0) nextInterval = 1;
        else if (repetitions === 1) nextInterval = 6;
        else nextInterval = Math.round(interval * easiness);
        nextRepetitions += 1;
      } else {
        nextRepetitions = 0; nextInterval = 1;
      }
      nextEasiness = easiness + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
      if (nextEasiness < 1.3) nextEasiness = 1.3;
      const nextDueDate = new Date(); nextDueDate.setDate(nextDueDate.getDate() + nextInterval);
      return { repetitions: nextRepetitions, interval: nextInterval, easiness: nextEasiness, dueDate: nextDueDate.toISOString() };
    };

    // Small self-contained inline editor used by the Manage Cards modal.
    function EditCardForm({ card, t, onSave, onCancel }) {
      const [front, setFront] = useState(card.front);
      const [back, setBack] = useState(card.back);
      const [image, setImage] = useState(card.image || '');

      return (
        <div className="space-y-2">
          <textarea value={front} onChange={(e) => setFront(e.target.value)} rows="2" className="w-full bg-white/5 border border-white/10 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-white/40" />
          <textarea value={back} onChange={(e) => setBack(e.target.value)} rows="2" className="w-full bg-white/5 border border-white/10 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-white/40" />
          <input type="url" value={image} onChange={(e) => setImage(e.target.value)} placeholder={t.imageUrlLabel} className="w-full bg-white/5 border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-white/40" />
          <div className="flex gap-2 pt-1">
            <button onClick={() => onSave(front, back, image)} className="flex-1 py-2 theme-btn text-white font-bold text-xs rounded-xl">{t.saveChanges}</button>
            <button onClick={onCancel} className="px-4 py-2 bg-white/5 border border-white/10 text-gray-400 font-bold text-xs rounded-xl">{t.cancel}</button>
          </div>
        </div>
      );
    }

    function App() {
      const [lang, setLang] = useState('ar');
      const t = translations[lang];

      const [activeTab, setActiveTab] = useState('decks');
      const [isMuted, setIsMuted] = useState(false);

      const [theme, setTheme] = useState('purple');
      const [colorMode, setColorMode] = useState(() => localStorage.getItem('ssc_colormode') || 'dark');

      const [isAddCardOpen, setIsAddCardOpen] = useState(false);
      const [isAddDeckOpen, setIsAddDeckOpen] = useState(false);
      const [isImportOpen, setIsImportOpen] = useState(false);
      const [isAiGenOpen, setIsAiGenOpen] = useState(false);
      const [isGuideOpen, setIsGuideOpen] = useState(false);
      const [manageDeckId, setManageDeckId] = useState(null);
      const [editingCardId, setEditingCardId] = useState(null);
      const [cardSearchQuery, setCardSearchQuery] = useState('');
      const [reviewDueOnly, setReviewDueOnly] = useState(true);

      const [selectedDeckForNewCard, setSelectedDeckForNewCard] = useState('');
      const [importText, setImportText] = useState('');

      const [newFront, setNewFront] = useState('');
      const [newBack, setNewBack] = useState('');
      const [newCardImage, setNewCardImage] = useState('');
      const [newDeckTitle, setNewDeckTitle] = useState('');
      const [newDeckDesc, setNewDeckDesc] = useState('');

      const [decks, setDecks] = useState(() => {
        try {
          const saved = localStorage.getItem('ssc_decks');
          if (saved) {
            const parsedSaved = JSON.parse(saved);

          }
          return [
            {

              title: 'Anatomy - Nervous System',
              description: 'Brain structure, cranial nerves, and synaptic transmission',
              cards: [
                { id: 'c1', front: 'What is the principal inhibitory neurotransmitter in the CNS?', back: 'GABA (Gamma-Aminobutyric Acid)', repetitions: 0, interval: 1, easiness: 2.5, dueDate: new Date().toISOString() },
                { id: 'c2', front: 'Which cranial nerve handles facial sensation?', back: 'Trigeminal Nerve (CN V)', repetitions: 2, interval: 6, easiness: 2.6, dueDate: new Date().toISOString() }
              ]
            }
          ];
        } catch(e) { return []; }
      });

      const [reviewDeckId, setReviewDeckId] = useState(null);
      const [reviewCardIds, setReviewCardIds] = useState([]);
      const [currentCardIdx, setCurrentCardIdx] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      
      // New feature states
      const [isTimeAttack, setIsTimeAttack] = useState(false);
      const [timeAttackSeconds, setTimeAttackSeconds] = useState(12);
      const [isAudioMode, setIsAudioMode] = useState(false);

      // Swipe gesture touch handling refs
      const touchStartX = useRef(0);
      const touchEndX = useRef(0);

      const [studyStats, setStudyStats] = useState(() => {
        const defaultStats = { 
          weeklyMinutesData: [0, 0, 0, 0, 0, 0, 0],
          weeklyCardsData: [0, 0, 0, 0, 0, 0, 0],
          streakDays: 3,
          lastActiveDate: new Date().toDateString(),
          totalReviews: 0,
          successfulReviews: 0
        };
        try {
          const saved = localStorage.getItem('ssc_stats');
          if (!saved) return defaultStats;
          const parsed = JSON.parse(saved);
          return {
            weeklyMinutesData: Array.isArray(parsed.weeklyMinutesData) && parsed.weeklyMinutesData.length === 7 ? parsed.weeklyMinutesData : [0, 0, 0, 0, 0, 0, 0],
            weeklyCardsData: Array.isArray(parsed.weeklyCardsData) && parsed.weeklyCardsData.length === 7 ? parsed.weeklyCardsData : [0, 0, 0, 0, 0, 0, 0],
            streakDays: parsed.streakDays || 1,
            lastActiveDate: parsed.lastActiveDate || new Date().toDateString(),
            totalReviews: Number.isFinite(parsed.totalReviews) ? parsed.totalReviews : 0,

          };
        } catch (e) {
          return defaultStats;
        }
      });

      const [showReminderBanner, setShowReminderBanner] = useState(false);

      const [timerMode, setTimerMode] = useState('focus');
      const [customMinutes, setCustomMinutes] = useState(25);
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const [completedFocusSessions, setCompletedFocusSessions] = useState(0);

      useEffect(() => { localStorage.setItem('ssc_decks', JSON.stringify(decks)); }, [decks]);
      useEffect(() => { localStorage.setItem('ssc_stats', JSON.stringify(studyStats)); }, [studyStats]);
      useEffect(() => { localStorage.setItem('ssc_colormode', colorMode); }, [colorMode]);

      // FIX: the streak counter used to be a static number that was saved but never
      // recalculated. On mount, compare the last active day to today: same day -> no
      // change, exactly one day ago -> +1, anything else (gap or corrupted date) -> reset to 1.
      useEffect(() => {
        setStudyStats(prev => {
          const today = new Date();
          const todayStr = today.toDateString();
          if (prev.lastActiveDate === todayStr) return prev;

          const lastActive = new Date(prev.lastActiveDate);
          let nextStreak = 1;
          if (!isNaN(lastActive.getTime())) {
            const msPerDay = 24 * 60 * 60 * 1000;
            const dayDiff = Math.round((new Date(todayStr) - new Date(lastActive.toDateString())) / msPerDay);
            if (dayDiff === 1) nextStreak = (prev.streakDays || 0) + 1;
            else if (dayDiff === 0) nextStreak = prev.streakDays || 1;
          }
          setShowReminderBanner(true);
          return { ...prev, streakDays: nextStreak, lastActiveDate: todayStr };
        });
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      useEffect(() => {
        const html = document.getElementById('html-root');
        if (html) {
          html.setAttribute('lang', lang);
          html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        }
      }, [lang]);

      useEffect(() => {
        document.body.className = `theme-${theme} ${colorMode === 'light' ? 'light-mode' : ''}`;
      }, [theme, colorMode]);

      // Time attack countdown effect
      useEffect(() => {
        let timer = null;
        if (reviewDeckId && isTimeAttack && !isFlipped) {
          if (timeAttackSeconds > 0) {
            timer = setTimeout(() => setTimeAttackSeconds(prev => prev - 1), 1000);
          } else {
            handleRateCard(0);
          }
        }
        return () => clearTimeout(timer);
      }, [reviewDeckId, isTimeAttack, timeAttackSeconds, isFlipped]);

      // Audio-only mode automated loop supporting multilinguality or gracefully handling audio if browser lacks multi-language TTS
      useEffect(() => {
        let audioTimer = null;
        if (reviewDeckId && isAudioMode) {
          const currentDeck = decks.find(d => d.id === reviewDeckId);
          const card = currentDeck?.cards.find(c => c.id === reviewCardIds[currentCardIdx]);
          if (card) {
            speakText(`${t.cardFront}: ${card.front}`);
            audioTimer = setTimeout(() => {
              speakText(`${t.cardBack}: ${card.back}`);
              setTimeout(() => {
                if (currentCardIdx + 1 < reviewCardIds.length) {
                  setCurrentCardIdx(prev => prev + 1);
                  setIsFlipped(false);
                } else {
                  setIsAudioMode(false);
                  setReviewDeckId(null);
                }
              }, 4000);
            }, 5000);
          }
        }
        return () => clearTimeout(audioTimer);
      }, [reviewDeckId, isAudioMode, currentCardIdx, lang, reviewCardIds]);

      useEffect(() => {
        let interval = null;
        if (isTimerRunning && timeLeft > 0) {
          interval = setInterval(() => setTimeLeft((prev) => prev - 1), 1000);
        } else if (timeLeft === 0 && isTimerRunning) {
          feedback.playTone(880, 0.6);
          triggerConfetti();
          const today = new Date().getDay();

          if (timerMode === 'focus') {
            const nextCount = completedFocusSessions + 1;
            setCompletedFocusSessions(nextCount);

            setStudyStats(prev => {
              const updatedMins = [...(prev.weeklyMinutesData || [0,0,0,0,0,0,0])];
              updatedMins[today] += customMinutes;
              return { ...prev, weeklyMinutesData: updatedMins };
            });

            if (nextCount % 4 === 0) {
              setTimerMode('long');
              setCustomMinutes(15);
              setTimeLeft(15 * 60);
            } else {
              setTimerMode('short');
              setCustomMinutes(5);
              setTimeLeft(5 * 60);
            }
          } else {
            setTimerMode('focus');
            setCustomMinutes(25);
            setTimeLeft(25 * 60);
          }
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timeLeft, timerMode, customMinutes, completedFocusSessions]);

      const toggleLanguage = () => {
        feedback.playClick(800);
        setLang(prev => prev === 'ar' ? 'en' : (prev === 'en' ? 'fr' : 'ar'));
      };

      const handleMinutesChange = (newMins) => {
        const mins = Math.max(1, Math.min(180, parseInt(newMins) || 1));
        setCustomMinutes(mins);
        setTimeLeft(mins * 60);
        setIsTimerRunning(false);
      };

      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          if (lang === 'ar') utterance.lang = 'ar-SA';
          else if (lang === 'fr') utterance.lang = 'fr-FR';
          else utterance.lang = 'en-US';
          window.speechSynthesis.speak(utterance);
        }
      };

      const exportBackupJSON = () => {
        const backup = { decks, studyStats, completedFocusSessions };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `study_companion_pro_backup_${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importBackupJSON = (e) => {
        const file = e.target.files[0];
        const inputEl = e.target;
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            const cleanedDecks = sanitizeDecksArray(parsed.decks);
            if (!cleanedDecks) throw new Error('invalid decks shape');

            let cleanedStats = null;
            if (parsed.studyStats && typeof parsed.studyStats === 'object') {
              const s = parsed.studyStats;
              cleanedStats = {
                weeklyMinutesData: Array.isArray(s.weeklyMinutesData) && s.weeklyMinutesData.length === 7 && s.weeklyMinutesData.every(Number.isFinite) ? s.weeklyMinutesData : [0,0,0,0,0,0,0],
                weeklyCardsData: Array.isArray(s.weeklyCardsData) && s.weeklyCardsData.length === 7 && s.weeklyCardsData.every(Number.isFinite) ? s.weeklyCardsData : [0,0,0,0,0,0,0],
                streakDays: Number.isFinite(s.streakDays) && s.streakDays > 0 ? s.streakDays : 1,
                lastActiveDate: typeof s.lastActiveDate === 'string' && !isNaN(new Date(s.lastActiveDate).getTime()) ? s.lastActiveDate : new Date().toDateString()
              };
            }

            const cleanedSessions = Number.isFinite(parsed.completedFocusSessions) && parsed.completedFocusSessions >= 0 ? parsed.completedFocusSessions : null;

            setDecks(cleanedDecks);
            if (cleanedStats) setStudyStats(cleanedStats);
            if (cleanedSessions !== null) setCompletedFocusSessions(cleanedSessions);

            alert(lang === 'ar' ? 'تم استرجاع النسخة الاحتياطية بنجاح!' : (lang === 'fr' ? 'Sauvegarde restaurée avec succès !' : 'Backup restored successfully!'));
          } catch (err) {
            alert(lang === 'ar' ? 'ملف غير صالح أو تالف!' : (lang === 'fr' ? 'Fichier invalide ou corrompu !' : 'Invalid or corrupted backup file!'));
          } finally {
            inputEl.value = '';
          }
        };
        reader.onerror = () => {
          alert(lang === 'ar' ? 'تعذرت قراءة الملف!' : (lang === 'fr' ? 'Impossible de lire le fichier !' : 'Could not read the file!'));
          inputEl.value = '';
        };
        reader.readAsText(file);
      };

      // FIX: paste-in CSV/JSON import — the UI strings existed but no handler or
      // modal was ever wired up, so this feature was completely unreachable.
      const handleProcessImport = (e) => {
        e.preventDefault();
        if (!importText.trim() || !selectedDeckForNewCard) return;
        feedback.playClick(900);

        const importedCards = parseCardsFromText(importText);

        if (importedCards.length === 0) {
          alert(lang === 'ar' ? 'تعذر العثور على بطاقات صالحة في النص (استخدم صيغة JSON أو CSV بعمودين front,back)' : (lang === 'fr' ? 'Aucune carte valide trouvée (utilisez le format JSON ou CSV front,back)' : 'No valid cards found (use JSON or two-column CSV: front,back)'));
          return;
        }

        const newCards = importedCards.map((c, i) => ({
          id: 'card-import-' + Date.now() + '-' + i,
          front: c.front,
          back: c.back,
          image: c.image || '',

        }));

        setDecks(decks.map(d => d.id === selectedDeckForNewCard ? { ...d, cards: [...d.cards, ...newCards] } : d));
        setImportText('');
        setIsImportOpen(false);
        alert(lang === 'ar' ? `تم إستيراد ${newCards.length} بطاقة بنجاح!` : (lang === 'fr' ? `${newCards.length} cartes importées avec succès !` : `Successfully imported ${newCards.length} cards!`));
      };

      const handleDeleteDeck = (deckId, deckTitle) => {
        feedback.playClick(400);
        if (confirm(`${t.confirmDeleteDeck}\n\n[ ${deckTitle} ]`)) {
          setDecks(decks.filter(d => d.id !== deckId));

      };

      const confirmDiscard = (hasUnsavedText) => {
        if (!hasUnsavedText) return true;
        return confirm(lang === 'ar' ? 'لديك نص لم يُحفظ، هل تريد تجاهله؟' : (lang === 'fr' ? 'Vous avez du texte non enregistré. Voulez-vous l\'ignorer ?' : 'You have unsaved text. Discard it?'));
      };

      const handleAddCard = (e) => {
        e.preventDefault();
        if (!newFront.trim() || !newBack.trim() || !selectedDeckForNewCard) return;
        feedback.playClick(900);
        const newCard = { id: 'card-' + Date.now(), front: newFront, back: newBack, image: isSafeImageUrl(newCardImage) ? newCardImage.trim() : '', repetitions: 0, interval: 1, easiness: 2.5, dueDate: new Date().toISOString() };
        setDecks(decks.map(d => d.id === selectedDeckForNewCard ? { ...d, cards: [...d.cards, newCard] } : d));
        setNewFront(''); setNewBack(''); setNewCardImage(''); setIsAddCardOpen(false);
      };

      const handleUpdateCard = (deckId, cardId, updatedFront, updatedBack, updatedImage) => {
        if (!updatedFront.trim() || !updatedBack.trim()) return;
        setDecks(decks.map(d => d.id === deckId
          ? { ...d, cards: d.cards.map(c => c.id === cardId ? { ...c, front: updatedFront, back: updatedBack, image: isSafeImageUrl(updatedImage) ? updatedImage.trim() : '' } : c) }
          : d));
        setEditingCardId(null);
      };

      const handleDeleteCard = (deckId, cardId, cardFront) => {
        const confirmMsg = lang === 'ar' ? `حذف هذه البطاقة؟\n\n"${cardFront}"` : (lang === 'fr' ? `Supprimer cette carte ?\n\n"${cardFront}"` : `Delete this card?\n\n"${cardFront}"`);
        if (!confirm(confirmMsg)) return;
        feedback.playClick(400);
        setDecks(decks.map(d => d.id === deckId ? { ...d, cards: d.cards.filter(c => c.id !== cardId) } : d));
      };

      const exportDeckJSON = (deck) => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(deck, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `${deck.title.replace(/[^a-z0-9\u0600-\u06FF_-]+/gi, '_')}_${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleAddDeck = (e) => {
        e.preventDefault();
        if (!newDeckTitle.trim()) return;
        feedback.playClick(900);
        const newDeck = { id: 'deck-' + Date.now(), title: newDeckTitle, description: newDeckDesc || 'Study Deck', cards: [] };
        setDecks([...decks, newDeck]);
        setNewDeckTitle(''); setNewDeckDesc(''); setIsAddDeckOpen(false);
      };

      // The app has no built-in AI model and never calls any external AI API on its
      // own (that would require the user to embed a personal API key directly in
      // client-side code, which is visible to anyone who opens the file — unsafe).
      // Instead: give the user a ready-made prompt to copy into whatever AI tool
      // they already use, then parse whatever that AI replies with.
      const [promptCopied, setPromptCopied] = useState(false);
      const handleCopyAiPrompt = async () => {
        feedback.playClick(900);
        const ok = await copyTextToClipboard(t.aiPromptTemplate);
        if (ok) {
          setPromptCopied(true);
          setTimeout(() => setPromptCopied(false), 2500);
        } else {
          alert(lang === 'ar' ? 'تعذر النسخ تلقائياً. حدد النص يدوياً وانسخه (Ctrl/⌘+C).' : (lang === 'fr' ? 'Copie automatique impossible. Sélectionnez le texte et copiez-le manuellement (Ctrl/⌘+C).' : 'Automatic copy failed. Please select the text and copy it manually (Ctrl/⌘+C).'));
        }
      };

      const handleAiGenerateCards = (e) => {
        e.preventDefault();
        if (!aiSourceText.trim() || !selectedDeckForNewCard) return;
        feedback.playClick(900);

        const parsedCards = parseCardsFromText(aiSourceText);

        if (parsedCards.length === 0) {
          alert(lang === 'ar' ? 'تعذر العثور على بطاقات في الرد الذي لصقته. تأكد أنك لصقت رد الذكاء الاصطناعي بالكامل كما هو.' : (lang === 'fr' ? "Aucune carte trouvée dans le texte collé. Assurez-vous d'avoir collé la réponse complète de l'IA telle quelle." : "No cards found in the pasted text. Make sure you pasted the AI's full reply as-is."));
          return;
        }

        const generatedCards = parsedCards.map((c, i) => ({
          id: 'card-ai-' + Date.now() + '-' + i,
          front: c.front,
          back: c.back,
          image: c.image || '',
          repetitions: 0, interval: 1, easiness: 2.5, dueDate: new Date().toISOString()
        }));

        setDecks(decks.map(d => d.id === selectedDeckForNewCard ? { ...d, cards: [...d.cards, ...generatedCards] } : d));
        setAiSourceText('');
        setIsAiGenOpen(false);
        alert(lang === 'ar' ? `تمت إضافة ${generatedCards.length} بطاقة بنجاح!` : (lang === 'fr' ? `${generatedCards.length} cartes ajoutées avec succès !` : `Successfully added ${generatedCards.length} cards!`));
      };

      const startReview = (deckId, timeAttack = false, audioMode = false, dueOnly = true) => {
        const deck = decks.find(d => d.id === deckId);
        if (!deck || deck.cards.length === 0) return alert(lang === 'ar' ? 'هذه المجموعة فارغة!' : (lang === 'fr' ? 'Ce paquet est vide !' : 'This deck is empty!'));

        let cardsToReview = dueOnly ? deck.cards.filter(isCardDue) : deck.cards;
        if (dueOnly && cardsToReview.length === 0) {
          const reviewAllAnyway = confirm(
            lang === 'ar' ? 'لا توجد بطاقات مستحقة اليوم في هذه المجموعة. هل تريد مراجعة كل البطاقات على أي حال؟' :
            (lang === 'fr' ? "Aucune carte n'est due aujourd'hui dans ce paquet. Voulez-vous réviser toutes les cartes quand même ?" :
            'No cards are due today in this deck. Review all cards anyway?')
          );
          if (!reviewAllAnyway) return;
          cardsToReview = deck.cards;
        }

        feedback.playClick(650);
        setReviewDeckId(deckId);
        setReviewCardIds(cardsToReview.map(c => c.id));
        setReviewDueOnly(dueOnly);
        setCurrentCardIdx(0); 
        setIsFlipped(false);
        setIsTimeAttack(timeAttack);
        setTimeAttackSeconds(12);
        setIsAudioMode(audioMode);
      };

      const handleRateCard = (quality) => {
        const currentDeck = decks.find(d => d.id === reviewDeckId);
        const currentCardId = reviewCardIds[currentCardIdx];
        const currentCard = currentDeck?.cards?.find(c => c.id === currentCardId);
        if (!currentDeck || !currentCard) { setReviewDeckId(null); setIsAudioMode(false); return; }
        feedback.playRatingSound(quality);
        const updatedCardData = calculateSM2(quality, currentCard.repetitions, currentCard.interval, currentCard.easiness);

        setDecks(decks.map(d => {
          if (d.id === reviewDeckId) {
            const updatedCards = d.cards.map(c => c.id === currentCardId ? { ...c, ...updatedCardData } : c);
            return { ...d, cards: updatedCards };
          }
          return d;
        }));

        const today = new Date().getDay();
        setStudyStats(prev => {
          const updatedWeeklyCards = [...(prev.weeklyCardsData || [0,0,0,0,0,0,0])];
          updatedWeeklyCards[today] += 1;
          return {
            ...prev,
            weeklyCardsData: updatedWeeklyCards,
            totalReviews: (prev.totalReviews || 0) + 1,
            successfulReviews: (prev.successfulReviews || 0) + (quality >= 3 ? 1 : 0)
          };
        });
        setShowReminderBanner(false);

        if (currentCardIdx + 1 < reviewCardIds.length) {
          setCurrentCardIdx(prev => prev + 1); 
          setIsFlipped(false);
          setTimeAttackSeconds(12);
        } else {
          triggerConfetti();
          setReviewDeckId(null);
          setIsAudioMode(false);
        }

        touchStartX.current = e.targetTouches[0].clientX;

        touchEndX.current = e.targetTouches[0].clientX;
      };

      const handleTouchEnd = () => {
        if (!reviewDeckId) return;

        const distance = touchStartX.current - touchEndX.current;
        const threshold = 50; // min swipe distance in px

        if (Math.abs(distance) > threshold) {
          feedback.playClick(700);
          if (currentCardIdx + 1 < reviewCardIds.length) {
            setCurrentCardIdx(prev => prev + 1);
            setIsFlipped(false);
            setTimeAttackSeconds(12);

            setReviewDeckId(null);
            setIsAudioMode(false);

        if (!deck.cards || deck.cards.length === 0) return 0;
        const avgEasiness = deck.cards.reduce((acc, c) => acc + (c.easiness || 2.5), 0) / deck.cards.length;
        const diffPercent = Math.round(((3.0 - avgEasiness) / 1.7) * 100);
        return Math.max(5, Math.min(100, diffPercent));
      };

      const formatTime = (s) => `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;
      
      const allCards = decks.flatMap(d => d.cards);
      const totalCardsCount = allCards.length;
      const newCardsCount = allCards.filter(c => c.repetitions === 0).length;
      const learningCardsCount = allCards.filter(c => c.repetitions > 0 && c.repetitions < 3).length;
      const masteredCardsCount = allCards.filter(c => c.repetitions >= 3).length;
      const masteryPercentage = totalCardsCount > 0 ? Math.round((masteredCardsCount / totalCardsCount) * 100) : 0;
      const retentionPercentage = (studyStats.totalReviews || 0) > 0 ? Math.round(((studyStats.successfulReviews || 0) / studyStats.totalReviews) * 100) : null;

      const safeWeeklyCards = studyStats.weeklyCardsData || [0,0,0,0,0,0,0];

                    <div style={{ width: `${totalCardsCount > 0 ? (masteredCardsCount / totalCardsCount) * 100 : 0}%` }} className="bg-emerald-500 h-full transition-all"></div>
                  </div>

                  <div className="grid grid-cols-3 gap-3 text-center">
                    <div className="bg-blue-500/10 border border-blue-500/20 p-3 rounded-2xl">
                      <span className="text-xl font-bold text-blue-400 block">{newCardsCount}</span>
                      <span className="text-[11px] text-gray-400">{t.newCards}</span>
                    </div>
                    <div className="bg-amber-500/10 border border-amber-500/20 p-3 rounded-2xl">
                      <span className="text-xl font-bold text-amber-400 block">{learningCardsCount}</span>
                      <span className="text-[11px] text-gray-400">{t.learningCards}</span>
                    </div>
                    <div className="bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-2xl">
                      <span className="text-xl font-bold text-emerald-400 block">{masteredCardsCount}</span>
                      <span className="text-[11px] text-gray-400">{t.masteredCards}</span>
                    </div>
                  </div>
                </div>

                <div className="glass-panel rounded-3xl p-6 border border-white/10">
                  <div className="flex justify-between items-center mb-6">
                    <h3 className="text-sm font-bold theme-text flex items-center gap-2">
                      {t.weeklyActivity}
                    </h3>
                    <div className="flex gap-4 text-xs font-semibold">
                      <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full theme-btn inline-block"></span> <span className="text-gray-400">{t.legendMinutes}</span></div>
                      <div className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-cyan-400 inline-block"></span> <span className="text-gray-400">{t.legendCards}</span></div>
                    </div>
                  </div>
                  
                  <div className="h-52 flex items-end justify-between gap-3 pt-8 pb-2 px-2">
                    {safeWeeklyMins.map((minVal, idx) => {
                      const cardVal = safeWeeklyCards[idx] || 0;
                      const minHeight = Math.min(100, Math.max(8, (minVal / maxWeeklyMinsVal) * 100));
                      const cardHeight = Math.min(100, Math.max(8, (cardVal / maxWeeklyCardsVal) * 100));
                      const isToday = idx === new Date().getDay();

                      return (
                        <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group">
                          <div className="flex gap-1 items-end h-full w-full justify-center">
                            <div 
                              className={`w-1/2 max-w-[16px] rounded-t-lg transition-all duration-500 ${isToday ? 'theme-btn shadow-lg' : 'opacity-40 theme-btn group-hover:opacity-70'}`}
                              style={{ height: `${minHeight}%` }}
                              title={`${minVal} ${t.minutes}`}
                            ></div>
                            <div 
                              className={`w-1/2 max-w-[16px] rounded-t-lg transition-all duration-500 ${isToday ? 'bg-gradient-to-t from-cyan-600 to-cyan-400 shadow-lg shadow-cyan-500/30' : 'bg-cyan-500/30 group-hover:bg-cyan-400/60'}`}
                              style={{ height: `${cardHeight}%` }}
                              title={`${cardVal} ${t.cardsCount}`}
                            ></div>
                          </div>
                          <span className={`text-xs mt-3 font-semibold ${isToday ? 'theme-text font-bold' : 'text-gray-400'}`}>
                            {t.weekDays[idx]}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* BADGES & TROPHIES TAB */}
            {activeTab === 'badges' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {trophiesList.map((tr) => (
                  <div key={tr.id} className={`glass-panel rounded-3xl p-5 border transition flex items-center gap-4 ${tr.unlocked ? 'border-amber-500/40 bg-amber-500/5' : 'border-white/5 opacity-50'}`}>
                    <div className="w-14 h-14 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-3xl shadow-inner">
                      {tr.icon}
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <h4 className="font-bold text-white text-base">{tr.title}</h4>
                        {tr.unlocked && <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-bold">{t.unlockedTag}</span>}
                      </div>
                      <p className="text-xs text-gray-400 mt-1">{tr.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* MODAL: MANAGE CARDS (search / edit / delete) */}
          {manageDeckId && (() => {
            const manageDeck = decks.find(d => d.id === manageDeckId);
            if (!manageDeck) return null;
            const query = cardSearchQuery.trim().toLowerCase();
            const filteredCards = query
              ? manageDeck.cards.filter(c => c.front.toLowerCase().includes(query) || c.back.toLowerCase().includes(query))
              : manageDeck.cards;
            return (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
                <div className="glass-panel border border-white/20 rounded-3xl p-6 w-full max-w-2xl shadow-2xl max-h-[85vh] flex flex-col">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold text-white">{t.manageCards} — {manageDeck.title}</h3>
                    <button onClick={() => { setManageDeckId(null); setEditingCardId(null); }} className="px-3 py-1.5 bg-white/5 border border-white/10 text-gray-300 rounded-lg text-xs font-bold">{t.closeBtn} ✕</button>
                  </div>

                  <input
                    type="text"
                    value={cardSearchQuery}
                    onChange={(e) => setCardSearchQuery(e.target.value)}
                    placeholder={t.searchCardsPlaceholder}
                    className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white mb-4 focus:outline-none focus:border-white/40"
                  />

                  <div className="overflow-y-auto space-y-3 pr-1">
                    {filteredCards.length === 0 && (
                      <p className="text-center text-sm text-gray-500 py-8">{t.noCardsFound}</p>
                    )}
                    {filteredCards.map(card => (
                      <div key={card.id} className="bg-white/5 border border-white/10 rounded-2xl p-4">
                        {editingCardId === card.id ? (
                          <EditCardForm
                            card={card}
                            t={t}
                            onSave={(f, b, img) => handleUpdateCard(manageDeck.id, card.id, f, b, img)}
                            onCancel={() => setEditingCardId(null)}
                          />
                        ) : (
                          <div className="flex justify-between items-start gap-3">
                            <div className="flex-1 min-w-0">
                              <div className="flex items-center gap-2 flex-wrap mb-1">
                                {isCardDue(card) && <span className="text-[10px] bg-amber-500/15 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-bold">{t.dueTodayBadge}</span>}
                              </div>
                              {card.image && <img src={card.image} alt="" onError={(e) => { e.target.style.display = 'none'; }} className="max-h-20 rounded-lg mb-2 border border-white/10" />}
                              <p className="text-sm text-gray-100 font-semibold break-words">{card.front}</p>
                              <p className="text-xs text-gray-400 mt-1 break-words">{card.back}</p>
                            </div>
                            <div className="flex gap-1.5 shrink-0">
                              <button onClick={() => setEditingCardId(card.id)} className="px-2.5 py-1.5 bg-white/10 hover:bg-white/20 text-gray-200 rounded-lg text-[11px] font-bold">{t.editCard}</button>
                              <button onClick={() => handleDeleteCard(manageDeck.id, card.id, card.front)} className="px-2.5 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg text-[11px] font-bold">{t.deleteCard}</button>
                            </div>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            );
          })()}

          {/* MODAL: ADD CARD */}
          {isAddCardOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="glass-panel border border-white/20 rounded-3xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-lg font-bold text-white mb-4">{t.addCardTitle}</h3>
                <form onSubmit={handleAddCard} className="space-y-4">
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">{t.selectDeck}</label>
                    <select value={selectedDeckForNewCard} onChange={(e) => setSelectedDeckForNewCard(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none">
                      {decks.map(d => <option key={d.id} value={d.id} className="bg-gray-900 text-white">{d.title}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">{t.frontLabel}</label>
                    <textarea required value={newFront} onChange={(e) => setNewFront(e.target.value)} rows="3" className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-white/40" />
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">{t.backLabel}</label>
                    <textarea required value={newBack} onChange={(e) => setNewBack(e.target.value)} rows="3" className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-white/40" />
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">{t.imageUrlLabel}</label>
                    <input type="url" value={newCardImage} onChange={(e) => setNewCardImage(e.target.value)} placeholder="https://..." className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-white/40" />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-3 theme-btn text-white font-bold text-xs rounded-xl shadow-lg">{t.saveCard}</button>
                    <button type="button" onClick={() => { if (confirmDiscard(newFront.trim() || newBack.trim() || newCardImage.trim())) { setNewFront(''); setNewBack(''); setNewCardImage(''); setIsAddCardOpen(false); } }} className="px-4 py-3 bg-white/5 border border-white/10 text-gray-400 font-bold text-xs rounded-xl">{t.cancel}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: AI GENERATOR */}
          {isAiGenOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="glass-panel border border-white/20 rounded-3xl p-6 w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto">
                <h3 className="text-lg font-bold text-white mb-2">{t.aiGenTitle}</h3>
                <p className="text-xs text-gray-400 mb-4">{t.aiGenHint}</p>

                {/* STEP 1: copy the fixed prompt to use in the user's own AI tool */}
                <div className="mb-5 bg-white/5 border border-white/10 rounded-2xl p-4">
                  <p className="text-xs font-bold text-purple-300 mb-2">{t.aiStep1Title}</p>
                  <p className="text-[11px] text-gray-400 mb-3 leading-relaxed">{t.aiStep1Desc}</p>
                  <textarea
                    readOnly
                    value={t.aiPromptTemplate}
                    rows="6"
                    onFocus={(e) => e.target.select()}
                    className="w-full bg-black/20 border border-white/10 rounded-xl p-3 text-[11px] font-mono text-gray-300 focus:outline-none resize-none"
                  />
                  <button type="button" onClick={handleCopyAiPrompt} className="mt-2 w-full py-2.5 bg-purple-600/30 border border-purple-400/40 text-purple-200 font-bold text-xs rounded-xl hover:bg-purple-600/50 transition">
                    {promptCopied ? t.promptCopiedMsg : t.copyPromptBtn}
                  </button>
                </div>

                {/* STEP 2: paste back whatever the external AI replied with */}
                <form onSubmit={handleAiGenerateCards} className="space-y-4">
                  <div>
                    <p className="text-xs font-bold text-cyan-300 mb-1">{t.aiStep2Title}</p>
                    <p className="text-[11px] text-gray-400 mb-2 leading-relaxed">{t.aiStep2Desc}</p>
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">{t.selectDeck}</label>
                    <select value={selectedDeckForNewCard} onChange={(e) => setSelectedDeckForNewCard(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none">
                      {decks.map(d => <option key={d.id} value={d.id} className="bg-gray-900 text-white">{d.title}</option>)}
                    </select>
                  </div>
                  <div>
                    <textarea 
                      required 
                      value={aiSourceText} 
                      onChange={(e) => setAiSourceText(e.target.value)} 
                      rows="6" 
                      placeholder={t.aiGenPlaceholder}
                      className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-white/40" 
                    />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-purple-600/30">{t.convertToCardsBtn}</button>
                    <button type="button" onClick={() => { if (confirmDiscard(aiSourceText.trim())) { setAiSourceText(''); setIsAiGenOpen(false); } }} className="px-4 py-3 bg-white/5 border border-white/10 text-gray-400 font-bold text-xs rounded-xl">{t.cancel}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: IMPORT CARDS (CSV/JSON) */}
          {isImportOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="glass-panel border border-white/20 rounded-3xl p-6 w-full max-w-lg shadow-2xl">
                <h3 className="text-lg font-bold text-white mb-2">{t.importTitle}</h3>
                <p className="text-xs text-gray-400 mb-4">{t.importHint}</p>
                <form onSubmit={handleProcessImport} className="space-y-4">
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">{t.selectDeck}</label>
                    <select value={selectedDeckForNewCard} onChange={(e) => setSelectedDeckForNewCard(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none">
                      {decks.map(d => <option key={d.id} value={d.id} className="bg-gray-900 text-white">{d.title}</option>)}
                    </select>
                  </div>
                  <div>
                    <textarea
                      required
                      value={importText}
                      onChange={(e) => setImportText(e.target.value)}
                      rows="6"
                      placeholder={'[{"front":"Q","back":"A"}]  —  or —  Q1,A1'}
                      className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white font-mono focus:outline-none focus:border-white/40"
                    />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-3 bg-amber-600 text-white font-bold text-xs rounded-xl shadow-lg">{t.processImport}</button>
                    <button type="button" onClick={() => { if (confirmDiscard(importText.trim())) { setImportText(''); setIsImportOpen(false); } }} className="px-4 py-3 bg-white/5 border border-white/10 text-gray-400 font-bold text-xs rounded-xl">{t.cancel}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: ADD DECK */}
          {isAddDeckOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="glass-panel border border-white/20 rounded-3xl p-6 w-full max-w-md shadow-2xl">
                <h3 className="text-lg font-bold text-white mb-4">{t.addDeckTitle}</h3>
                <form onSubmit={handleAddDeck} className="space-y-4">
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">{t.deckNameLabel}</label>
                    <input type="text" required value={newDeckTitle} onChange={(e) => setNewDeckTitle(e.target.value)} className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-white/40" />
                  </div>
                  <div>
                    <label className="block text-xs text-gray-300 mb-1">{t.deckDescLabel}</label>
                    <textarea value={newDeckDesc} onChange={(e) => setNewDeckDesc(e.target.value)} rows="2" className="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-white/40" />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-3 theme-btn text-white font-bold text-xs rounded-xl shadow-lg">{t.createDeck}</button>
                    <button type="button" onClick={() => { if (confirmDiscard(newDeckTitle.trim() || newDeckDesc.trim())) { setNewDeckTitle(''); setNewDeckDesc(''); setIsAddDeckOpen(false); } }} className="px-4 py-3 bg-white/5 border border-white/10 text-gray-400 font-bold text-xs rounded-xl">{t.cancel}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: USER GUIDE */}
          {isGuideOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="glass-panel border border-white/20 rounded-3xl p-6 w-full max-w-lg shadow-2xl max-h-[85vh] overflow-y-auto">
                <h3 className="text-xl font-extrabold text-white mb-4 flex items-center gap-2">
                  <span>🚀</span> {t.guideTitle}
                </h3>
                
                <div className="space-y-4 text-xs leading-relaxed text-gray-300">
                  <div className="bg-white/5 p-4 rounded-2xl border border-white/10">
                    <h4 className="font-bold theme-text text-sm mb-1">{t.guideSec1Title}</h4>
                    <p>{t.guideSec1Desc}</p>
                  </div>

                  <div className="bg-white/5 p-4 rounded-2xl border border-white/10">
                    <h4 className="font-bold text-indigo-300 text-sm mb-1">{t.guideSec2Title}</h4>
                    <p>{t.guideSec2Desc}</p>
                  </div>

                  <div className="bg-white/5 p-4 rounded-2xl border border-white/10">
                    <h4 className="font-bold text-emerald-300 text-sm mb-1">{t.guideSec3Title}</h4>
                    <p>{t.guideSec3Desc}</p>
                  </div>

                  <div className="bg-white/5 p-4 rounded-2xl border border-white/10">
                    <h4 className="font-bold text-cyan-300 text-sm mb-1">{t.guideSec4Title}</h4>
                    <p>{t.guideSec4Desc}</p>
                  </div>
                </div>

                <div className="mt-6 text-center">
                  <button onClick={() => setIsGuideOpen(false)} className="w-full py-3 theme-btn text-white font-bold text-xs rounded-xl shadow-lg">{t.guideUnderstandBtn}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Plain (non-Babel) script: registers the service worker for offline
       support and installability. Requires the file to be served over HTTPS
       (or localhost) — browsers block service workers on file:// pages, so
       this silently does nothing if opened directly from disk instead of
       from a hosted URL. -->
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .catch((err) => console.warn('Service worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
